name: Bug report
description: Report incorrect ScopeWitness behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for helping make diff accountability more reliable.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include a minimal contract, claims, diff, and command.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Runtime
      description: Operating system and Node.js version
    validations:
      required: true
